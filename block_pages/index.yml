        role: Head of Digital Product
        bio: >-
          Paloma es la responsable de Producto de B100, un neobanco lanzado por
          ABANCA, donde fue responsable del área de Empendimiento e
          Intraemprendimiento... hasta que decició intraemprender ella misma
          ^__^


          Además de su rol actual, en 2012 lanzó su primera startup, fue dueña
          de su primer negocio de comercio electrónico de moda. Estudió
          Publicidad y comenzó su carrera trabajando en agencias como Young &
          Rubicam, y en la gestión de marcas en empresas como Estrella Galicia.


          Es madre de 2 hijos preciosos y, aunque nació en Pontevedra, se siente
          100% coruñesa y es muy del Depor.
